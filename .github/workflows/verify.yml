name: Verify Vault
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Install checksum-verified etcd for consensus tests
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o "$RUNNER_TEMP/etcd.tar.gz"
          echo "66bad39ed920f6fc15fd74adcb8bfd38ba9a6412f8c7852d09eb11670e88cac3  $RUNNER_TEMP/etcd.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vault-etcd"
          tar xzf "$RUNNER_TEMP/etcd.tar.gz" -C "$RUNNER_TEMP/vault-etcd" --strip-components=1
          echo "ETCD_BINARY=$RUNNER_TEMP/vault-etcd/etcd" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
